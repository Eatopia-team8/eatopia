spring:
  # 1. AWS Parameter Store에서 /config/dev/ 하위의 모든 설정 가져오기
  config:
    import:
      - "optional:aws-parameterstore:/config/dev/"

  # 2. AWS 리전 명시 (Parameter Store 접근 시 필수)
  cloud:
    aws:
      region:
        static: ap-northeast-2
      stack:
        auto: false

  # 3. DB 설정 (Parameter Store에서 ${db.host}, ${db.name} 등을 가져옴)
  datasource:
    url: jdbc:mysql://${db.host}:${db.port:3306}/${db.name}?useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: ${db.username}
    password: ${db.password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 4. JPA 설정
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        default_batch_fetch_size: 100

  # 5. Mail 설정 (Parameter Store에서 가져옴)
  mail:
    host: smtp.naver.com
    port: 465
    username: ${NAVER_MAIL_USER}
    password: ${NAVER_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

  # 6. Redis 설정 (Parameter Store에서 가져옴)
  data:
    redis:
      host: ${REDIS_HOST_DEV}
      port: 6379

# 7. Swagger 설정
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    display-request-duration: true
    tryItOutEnabled: true

# 8. 서버 설정
server:
  servlet:
    context-path: /api/eatopia

# 9. 로깅 설정
logging:
  level:
    org.springframework.security: INFO
    io.awspring.cloud: DEBUG  # AWS 라이브러리 로그
    org.springframework.core.env: DEBUG # 프로퍼티(설정값) 로딩 로그
